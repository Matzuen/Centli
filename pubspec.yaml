name: centli
description: "Centli - clear every bill"
publish_to: 'none'
version: 2.0.2+39
environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.0
  sqlite3: ^3.5.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.20.2
  share_plus: ^13.3.1
  excel: ^4.0.6
  file_picker: 13.1.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  fl_chart: ^1.2.0
  home_widget: 0.10.0
  image_picker: ^1.2.4
  flutter_svg: ^2.0.17
  package_info_plus: ^10.2.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/noti_templates.json
    - assets/legal/privacy_zh.txt
    # Flutter does not recurse directories; each icon category folder must be listed.
    - assets/icons/bank/
    - assets/icons/brand/
    - assets/icons/electronics/
    - assets/icons/food/
    - assets/icons/home/
    - assets/icons/life/
    - assets/icons/money/
    - assets/icons/office/
    - assets/icons/other/
    - assets/icons/payment/
    - assets/icons/transport/

