name: centli
description: "Centli - clear every bill"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.20.2
