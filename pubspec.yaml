  local_auth: ^2.3.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  fl_chart: ^1.2.0
  home_widget: 0.10.0
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
